<div class="login-container">
  <h2>Entrar no Sistema</h2>
  <!-- Voltamos a colocar o ngSubmit para chamar a função no TS -->
  <form (ngSubmit)="fazerLogin()">
    <div>
      <label for="email">E-mail:</label>
      <input name="email" name="email" id="email" [(ngModel)]="email">
    </div>
    <div>
      <label for="password">Palavra-passe:</label>

      <input type="password" name="password" id="password" [(ngModel)]="senha">
    </div>
    <button type="submit">Entrar</button>
  </form>
</div>
