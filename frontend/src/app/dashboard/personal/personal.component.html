<div class="dashboard-container">
  <aside class="sidebar">
    <h2>Área do Personal</h2>
    <nav>
      <ul>
        <li><a href="#">Meus Alunos</a></li>
        <li class="active"><a href="#">Gestão de Treinos</a></li>
        <li><a href="#">Avaliações Físicas</a></li>
      </ul>
    </nav>
    <button class="btn-logout">Sair</button>
  </aside>

  <main class="content">
    <header class="page-header">
      <div>
        <h1>Gestão de Treinos</h1>
        <p>Crie, edite e anexe vídeos ou documentos aos treinos.</p>
      </div>
      <button class="btn-primary">+ Novo Treino</button>
    </header>

    <!-- Tabela de Exemplo baseada nos seus endpoints de Treino -->
    <section class="data-section">
      <table class="data-table">
        <thead>
        <tr>
          <th>Nome do Treino</th>
          <th>Aluno(s)</th>
          <th>Anexo</th>
          <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td>Treino Hipertrofia A</td>
          <td>Todos</td>
          <td><button class="btn-icon" title="Fazer Upload (POST /upload)">📁 Anexar</button></td>
          <td class="actions-cell">
            <button class="btn-icon" title="Editar (PUT /update)">✏️</button>
            <button class="btn-icon delete" title="Apagar (DELETE /delete)">🗑️</button>
          </td>
        </tr>
        </tbody>
      </table>
    </section>

    <!-- Secção de Avaliações Físicas -->
    <header class="page-header mt-40">
      <div>
        <h1>Avaliações Físicas</h1>
        <p>Registe e atualize as métricas dos alunos.</p>
      </div>
      <button class="btn-secondary">+ Nova Avaliação</button>
    </header>
  </main>
</div>
